[project]
name = "devops-agent"
version = "0.1.0"
description = "研发效能AI Agent平台"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "black", "ruff"]

[tool.uvicorn]
host = "0.0.0.0"
port = 8000
reload = true

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
